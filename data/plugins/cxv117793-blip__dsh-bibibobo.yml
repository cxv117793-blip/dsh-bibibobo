url: https://github.com/cxv117793-blip/dsh-bibibobo
name: cxv117793-blip/dsh-bibibobo
category: voice
description:
  en: 'Speaks settled DSH replies aloud with the bibibobo synthesizer: one sawtooth wave and two band-pass filters, no samples and no TTS model. A compact control in the composer toolbar provides speak, pause, resume and stop. Only completed replies are read, so streaming text never restarts mid-sentence, and while a reply is still streaming the control falls back to the previous finished one. Deterministic by design: a character always yields the same pitch and mouth shape. Markdown is stripped before speaking, and replies are capped at 1200 characters. Zero dependencies, MIT, no network access.'
  zh: '用 bibibobo 合成器把 DSH 已完成的回复念出来：一条锯齿波加两个带通滤波器，不用采样也不用 TTS 模型。输入框工具栏里一个紧凑控件提供朗读、暂停、继续、结束。只读已经完成的回复，流式输出不会念到一半重来；模型仍在输出时会退回上一条已完成的回复。同一个字永远是同一声（哈希决定音高与口型）。朗读前自动剥离 Markdown，超长回复截断到 1200 字。零依赖、MIT、不联网。'
