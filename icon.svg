  <rect x="27" y="23" width="4" height="18" rx="2" fill="#FF4D5E"/>
  <rect x="34" y="30" width="4" height="6" rx="2" fill="#FF4D5E"/>
  <rect x="41" y="24" width="4" height="16" rx="2" fill="#FF4D5E"/>
